name: Receive & Update Changelog + Auto Release

on:
  repository_dispatch:
    types: [sync-changelog] # Wakes up when aniswipe sends 'sync-changelog' event
  push:
    branches: [main]
    paths:
      - 'CHANGELOG.md' # Wakes up whenever CHANGELOG.md is pushed/synced to main
  workflow_dispatch: # Allows manual run anytime from Actions tab

permissions:
  contents: write # Required for pushing commits, tags, and creating GitHub Releases

jobs:
  update-changelog-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all tags and history

      - name: Download latest CHANGELOG.md from Web App (if accessible)
        run: |
          HTTP_CODE=$(curl -sSL -o temp_changelog.md -w "%{http_code}" -H "Authorization: token ${{ secrets.WEB_APP_PAT || secrets.RELEASES_REPO_PAT || '' }}" "https://raw.githubusercontent.com/Soujiro0/aniswipe/main/src/data/CHANGELOG.md")
          if [ "$HTTP_CODE" = "200" ]; then
            mv temp_changelog.md CHANGELOG.md
            echo "Downloaded fresh CHANGELOG.md via curl!"
          else
            echo "Note: Could not download via curl (HTTP $HTTP_CODE - private repository or no token). Using local CHANGELOG.md pushed directly by web app repo."
            rm -f temp_changelog.md
          fi

      - name: Commit & Push CHANGELOG.md (if modified via curl)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git add CHANGELOG.md
            git commit -m "docs: sync CHANGELOG.md from web app [skip ci]"
            git push origin main
            echo "CHANGELOG.md successfully synced and pushed!"
          else
            echo "CHANGELOG.md is already up to date."
          fi

      - name: Extract Latest Version & Check Tag
        id: check_version
        run: |
          # Extract the top version heading from CHANGELOG.md (e.g. "v1.2.0" or "1.2.0")
          RAW_VERSION=$(grep -m 1 '^### ' CHANGELOG.md | sed -E 's/^###[[:space:]]*(v?[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Found raw version in CHANGELOG.md: $RAW_VERSION"
          
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::No version header found in CHANGELOG.md! Check file content."
            exit 1
          fi
          
          # Ensure tag starts with 'v' to match aniswipe-releases convention (e.g. v1.2.0)
          if [[ "$RAW_VERSION" != v* ]]; then
            TAG_NAME="v$RAW_VERSION"
          else
            TAG_NAME="$RAW_VERSION"
          fi
          echo "Target tag name: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Check if git tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists on remote."
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME does not exist on remote yet."
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Release Notes for Latest Version
        if: steps.check_version.outputs.tag_exists == 'false'
        run: |
          TAG_NAME="${{ steps.check_version.outputs.tag_name }}"
          # Extract notes from current "###" heading up until the next "###" heading
          awk "/^###.*${TAG_NAME#v}/{flag=1; print; next} /^###/{flag=0} flag" CHANGELOG.md > release_notes.md
          
          echo "Extracted Release Notes:"
          cat release_notes.md

      - name: Create Git Tag & GitHub Release
        if: steps.check_version.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.check_version.outputs.tag_name }}"
          echo "Creating Git Tag and GitHub Release for $TAG_NAME..."
          
          # Create and push git tag
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          
          # Create GitHub Release using GitHub CLI
          gh release create "$TAG_NAME" -F release_notes.md --title "$TAG_NAME"
          echo "Successfully created GitHub Release $TAG_NAME!"
